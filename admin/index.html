<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regional Admin Sign In — GramSetu</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background-color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

  <div class="card" style="max-width: 480px; width: 100%; padding: 2.25rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
    
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div style="width: 54px; height: 54px; background: #0f172a; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #fff; margin: 0 auto 0.75rem auto;">
        🏛️
      </div>
      <h1 style="font-size: 1.55rem; color: #0f172a; font-weight: 800;">Gram<span style="color: #0284c7;">Setu</span> Regional Console</h1>
      <p style="font-size: 0.8125rem; color: #64748b; margin-top: 0.25rem; font-weight: 600;">
        Panchayat Development & Block Administrative Portal
      </p>
    </div>

    <!-- Quick Demo Logins -->
    <div style="background: #f0f9ff; border: 1px dashed #7dd3fc; border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1.5rem;">
      <div style="font-size: 0.8125rem; font-weight: 700; color: #0369a1; margin-bottom: 0.5rem;">
        ⚡ Instant Regional Demo Logins (Click to Autofill):
      </div>
      <div style="display: flex; flex-direction: column; gap: 0.5rem;">
        <button type="button" class="btn btn-secondary btn-sm" style="justify-content: flex-start; text-align: left; background: #fff;" onclick="autofillAdmin('rampur')">
          🏢 <strong>Rampur Gram Panchayat PDO</strong> (Ramesh Verma)
        </button>
        <button type="button" class="btn btn-secondary btn-sm" style="justify-content: flex-start; text-align: left; background: #fff;" onclick="autofillAdmin('shivapur')">
          🏢 <strong>Khed Shivapur Gram Panchayat BDO</strong> (Anil Deshmukh)
        </button>
      </div>
      <div style="font-size: 0.72rem; color: #0369a1; margin-top: 0.5rem; text-align: center;">
        Password: <strong>admin123</strong> (or <strong>Admin@123</strong>)
      </div>
    </div>

    <div id="alert-box" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.25rem; font-size: 0.875rem;"></div>

    <form onsubmit="handleAdminLogin(event)">
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem;">
          Official Email or Mobile <span style="color: #dc2626;">*</span>
        </label>
        <input type="text" id="admin-identifier" class="form-input" style="width: 100%;" placeholder="e.g. admin.rampur@gramsetu.gov.in" required>
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-size: 0.875rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem;">
          Administrative Password <span style="color: #dc2626;">*</span>
        </label>
        <input type="password" id="admin-password" class="form-input" style="width: 100%;" placeholder="Enter secure password" required>
      </div>

      <button type="submit" id="btn-admin-login" class="btn btn-primary btn-block" style="padding: 0.85rem;">
        Secure Official Sign In →
      </button>
    </form>

    <div style="margin-top: 1.75rem; text-align: center; border-top: 1px solid var(--admin-border); padding-top: 1.25rem;">
      <a href="../citizen/index.html" style="font-size: 0.8125rem; color: #0284c7; text-decoration: none; font-weight: 600;">
        ← Back to Citizen Grievance Portal
      </a>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (AdminAuth.isAuthenticated()) {
      window.location.href = 'dashboard.html';
    }

    const alertBox = document.getElementById('alert-box');

    const showAlert = (msg, isError = true) => {
      alertBox.style.display = 'block';
      alertBox.style.backgroundColor = isError ? '#fef2f2' : '#f0fdf4';
      alertBox.style.color = isError ? '#991b1b' : '#166534';
      alertBox.style.border = `1px solid ${isError ? '#fecaca' : '#bbf7d0'}`;
      alertBox.textContent = msg;
    };

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('action') === 'logged_out') {
      showAlert('Official administrative session signed out successfully.', false);
    } else if (urlParams.get('session') === 'expired') {
      showAlert('Your administrative session has expired. Please sign in again.');
    }

    function autofillAdmin(type) {
      if (type === 'rampur') {
        document.getElementById('admin-identifier').value = 'admin.rampur@gramsetu.gov.in';
        document.getElementById('admin-password').value = 'Admin@123';
        showToast('Autofilled credentials for Rampur Gram Panchayat PDO', 'info');
      } else {
        document.getElementById('admin-identifier').value = 'admin.shivapur@gramsetu.gov.in';
        document.getElementById('admin-password').value = 'Admin@123';
        showToast('Autofilled credentials for Khed Shivapur Gram Panchayat BDO', 'info');
      }
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      alertBox.style.display = 'none';

      const identifier = document.getElementById('admin-identifier').value.trim();
      const password = document.getElementById('admin-password').value;

      const submitBtn = document.getElementById('btn-admin-login');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying Administrative Credentials...';

      try {
        const isMobile = /^\d{10}$/.test(identifier);
        const payload = isMobile ? { mobile: identifier, password } : { email: identifier, password };

        const res = await AdminAPI.post('/auth/login', payload);

        if (res.success) {
          if (res.user.role !== 'regional_admin' && res.user.role !== 'super_admin') {
            showAlert('Access Denied: This account does not possess regional administrator privileges.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Secure Official Sign In →';
            return;
          }

          AdminAuth.setSession(res.token, res.user);
          const regionName = res.user.region ? (res.user.region.name || res.user.region) : 'Assigned Jurisdiction';
          showToast(`Welcome, ${res.user.name}! Accessing ${regionName}...`, 'success');

          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 600);
        }
      } catch (err) {
        showAlert(err.message || 'Authentication failed. Please check your credentials.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Secure Official Sign In →';
      }
    }
  </script>
</body>
</html>
